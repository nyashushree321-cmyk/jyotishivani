<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Radiant Golden Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#070611" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Golden Core Glow -->
  <circle cx="500" cy="500" r="480" fill="url(#centerAura)" />

  <!-- Outer Astral Orbit Rings -->
  <circle cx="500" cy="500" r="470" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.6"/>
  <circle cx="500" cy="500" r="455" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" opacity="0.75"/>
  <circle cx="500" cy="500" r="440" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5" stroke-dasharray="2,6" opacity="0.5"/>

  <!-- 12 Constellation Degree Nodes on Outer Rim -->
  <g stroke="url(#goldGrad1)" stroke-width="2" opacity="0.7">
    <line x1="500" y1="30" x2="500" y2="60"/>
    <line x1="500" y1="940" x2="500" y2="970"/>
    <line x1="30" y1="500" x2="60" y2="500"/>
    <line x1="940" y1="500" x2="970" y2="500"/>
    <line x1="168" y1="168" x2="190" y2="190"/>
    <line x1="810" y1="810" x2="832" y2="832"/>
    <line x1="168" y1="832" x2="190" y2="810"/>
    <line x1="810" y1="190" x2="832" y2="168"/>
    <line x1="265" y1="92" x2="280" y2="118"/>
    <line x1="720" y1="882" x2="735" y2="908"/>
    <line x1="92" y1="265" x2="118" y2="280"/>
    <line x1="882" y1="720" x2="908" y2="735"/>
    <line x1="735" y1="92" x2="720" y2="118"/>
    <line x1="280" y1="882" x2="265" y2="908"/>
    <line x1="908" y1="265" x2="882" y2="280"/>
    <line x1="118" y1="720" x2="92" y2="735"/>
  </g>

  <!-- 24 Sacred Lotus Petal Arcs -->
  <g fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" opacity="0.55">
    <path d="M500,60 Q550,180 500,240 Q450,180 500,60" />
    <path d="M500,940 Q550,820 500,760 Q450,820 500,940" />
    <path d="M60,500 Q180,550 240,500 Q180,450 60,500" />
    <path d="M940,500 Q820,550 760,500 Q820,450 940,500" />
    <path d="M189,189 Q274,274 316,316 Q231,358 189,189" />
    <path d="M811,811 Q726,726 684,684 Q769,642 811,811" />
    <path d="M189,811 Q274,726 316,684 Q231,642 189,811" />
    <path d="M811,189 Q726,274 684,316 Q769,358 811,189" />
  </g>

  <!-- 12 Astrological Houses Orbit Band -->
  <circle cx="500" cy="500" r="380" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="500" cy="500" r="320" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- 12 Radiating Rays (Zodiac Houses Divisions) -->
  <g stroke="url(#goldGrad1)" stroke-width="1.5" opacity="0.5">
    <line x1="500" y1="120" x2="500" y2="880"/>
    <line x1="120" y1="500" x2="880" y2="500"/>
    <line x1="231" y1="231" x2="769" y2="769"/>
    <line x1="231" y1="769" x2="769" y2="231"/>
    <line x1="330" y1="140" x2="670" y2="860"/>
    <line x1="670" y1="140" x2="330" y2="860"/>
    <line x1="140" y1="330" x2="860" y2="670"/>
    <line x1="140" y1="670" x2="860" y2="330"/>
  </g>

  <!-- Interlocking Sacred Sri Yantra Triangles & Octagram Stars -->
  <g fill="none" stroke="url(#goldGrad1)" stroke-width="2.2" opacity="0.75" filter="url(#glow)">
    <!-- Upward Triangles -->
    <polygon points="500,180 777,660 223,660"/>
    <polygon points="500,230 735,635 265,635" opacity="0.6"/>
    <!-- Downward Triangles -->
    <polygon points="500,820 223,340 777,340"/>
    <polygon points="500,770 265,365 735,365" opacity="0.6"/>
    <!-- Concentric Sacred Squares / Janam Kundli Frame -->
    <rect x="330" y="330" width="340" height="340" stroke="url(#goldGrad2)" stroke-width="2" transform="rotate(45 500 500)" opacity="0.8"/>
    <rect x="360" y="360" width="280" height="280" stroke="url(#goldGrad1)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Inner Sacred Rosette & Kaustubha Center -->
  <circle cx="500" cy="500" r="160" fill="none" stroke="url(#goldGrad1)" stroke-width="3" opacity="0.85"/>
  <circle cx="500" cy="500" r="120" fill="none" stroke="url(#goldGrad2)" stroke-width="1.8" stroke-dasharray="3,5" opacity="0.7"/>
  <circle cx="500" cy="500" r="80" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" opacity="0.9"/>
  <circle cx="500" cy="500" r="35" fill="none" stroke="#fde047" stroke-width="3" opacity="0.95" filter="url(#glow)"/>
  <circle cx="500" cy="500" r="12" fill="#ffd166" opacity="1" filter="url(#glow)"/>

  <!-- 12 Sacred Starburst Rays from Bindu -->
  <g stroke="#fde047" stroke-width="1.8" opacity="0.8">
    <line x1="500" y1="420" x2="500" y2="465"/>
    <line x1="500" y1="535" x2="500" y2="580"/>
    <line x1="420" y1="500" x2="465" y2="500"/>
    <line x1="535" y1="500" x2="580" y2="500"/>
    <line x1="443" y1="443" x2="475" y2="475"/>
    <line x1="525" y1="525" x2="557" y2="557"/>
    <line x1="443" y1="557" x2="475" y2="525"/>
    <line x1="525" y1="475" x2="557" y2="443"/>
  </g>
</svg>

