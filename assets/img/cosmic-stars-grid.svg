<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" opacity="0.35">
  <defs>
    <!-- Starlight dots -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Constellation Geometric Grid Lines -->
  <g stroke="rgba(245, 158, 11, 0.15)" stroke-width="0.8" fill="none">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>

    <!-- Diagonal Constellation Links -->
    <line x1="75" y1="75" x2="225" y2="150" stroke-dasharray="3,4"/>
    <line x1="225" y1="150" x2="375" y2="75" stroke-dasharray="3,4"/>
    <line x1="375" y1="75" x2="525" y2="225" stroke-dasharray="3,4"/>
    <line x1="75" y1="375" x2="180" y2="480" stroke-dasharray="3,4"/>
    <line x1="180" y1="480" x2="330" y2="420" stroke-dasharray="3,4"/>
    <line x1="330" y1="420" x2="480" y2="525" stroke-dasharray="3,4"/>
  </g>

  <!-- Glowing Star Nodes -->
  <!-- Cluster 1 -->
  <circle cx="75" cy="75" r="3.5" fill="#fde047"/>
  <circle cx="75" cy="75" r="12" fill="url(#starGlow)"/>
  <circle cx="225" cy="150" r="2.5" fill="#ffffff"/>
  <circle cx="375" cy="75" r="4" fill="#ffd166"/>
  <circle cx="375" cy="75" r="14" fill="url(#starGlow)"/>
  <circle cx="525" cy="225" r="3" fill="#ffffff"/>

  <!-- Cluster 2 -->
  <circle cx="150" cy="300" r="2" fill="#ffd166"/>
  <circle cx="300" cy="300" r="4.5" fill="#fde047"/>
  <circle cx="300" cy="300" r="16" fill="url(#starGlow)"/>
  <circle cx="450" cy="300" r="2.5" fill="#ffffff"/>

  <!-- Cluster 3 -->
  <circle cx="75" cy="375" r="3" fill="#ffffff"/>
  <circle cx="180" cy="480" r="4" fill="#ffd166"/>
  <circle cx="180" cy="480" r="14" fill="url(#starGlow)"/>
  <circle cx="330" cy="420" r="2.5" fill="#ffffff"/>
  <circle cx="480" cy="525" r="3.5" fill="#fde047"/>
  <circle cx="480" cy="525" r="12" fill="url(#starGlow)"/>

  <!-- Micro Star Dust -->
  <circle cx="120" cy="190" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="280" cy="110" r="1.2" fill="#fde047" opacity="0.7"/>
  <circle cx="420" cy="200" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="510" cy="100" r="1.5" fill="#ffd166" opacity="0.7"/>
  <circle cx="80" cy="490" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="240" cy="390" r="1" fill="#fde047" opacity="0.7"/>
  <circle cx="400" cy="470" r="1.5" fill="#ffd166" opacity="0.8"/>
  <circle cx="540" cy="410" r="1" fill="#ffffff" opacity="0.5"/>
</svg>

